version: '3.8'

services:
  ventas-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: db_ventas
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  despachos-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: db_despachos
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-ventas:
    build: ./back-Ventas_SpringBoot/Springboot-API-REST
    ports:
      - "8080:8080"
    environment:
      - DB_ENDPOINT=ventas-db
      - DB_PORT=3306
      - DB_NAME=db_ventas
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      ventas-db:
        condition: service_healthy

  service-despachos:
    build: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    ports:
      - "8081:8081"
    environment:
      - DB_ENDPOINT=despachos-db
      - DB_PORT=3306
      - DB_NAME=db_despachos
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      despachos-db:
        condition: service_healthy

  frontend:
    build: ./front_despacho
    ports:
      # Nginx usa el puerto 80 por dentro. Exponemos el 3000 por fuera como el profe.
      - "3000:80"
    depends_on:
      - service-ventas
      - service-despachos