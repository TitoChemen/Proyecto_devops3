name: CI/CD Backend Ventas

on:
  push:
    branches: ["deploy"]
    paths:
      - "back-Ventas_SpringBoot/**"
      - ".github/workflows/deploy-ventas.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build con Maven
        run: mvn clean package -DskipTests
        working-directory: ./back-Ventas_SpringBoot/Springboot-API-REST

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build y Push a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend-ventas
          IMAGE_TAG: latest
        run: |
          cd ./back-Ventas_SpringBoot/Springboot-API-REST
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy a EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend-ventas
          IMAGE_TAG: latest
        run: |
          aws eks update-kubeconfig --region us-east-1 --name innovatech-cluster
          sed -i "s|ECR_IMAGE_URI_PLACEHOLDER|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" ./infra/k8s/backendventas.yml
          kubectl apply -f ./infra/k8s/mysql-ventas.yml
          kubectl apply -f ./infra/k8s/backendventas.yml
          # Corrección: Forzar reinicio de pods para aplicar nueva imagen
          kubectl rollout restart deployment backend-ventas