name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Ventas Service (Skip Tests)
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          mvn clean package -DskipTests
          
      - name: Build Despachos Service (Skip Tests)
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          mvn clean package -DskipTests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: front_despacho/package-lock.json
          
      - name: Build Frontend
        run: |
          cd front_despacho
          npm install
          npm run build